{% extends "base.html" %}

{% block content %}
<div class="mb-8 flex flex-col md:flex-row gap-4">
    <div class="flex-1">
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Search notes..." 
                   class="w-full px-4 py-3 pl-12 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition">
            <svg class="w-5 h-5 text-gray-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <span id="noteCount" class="text-sm text-gray-400 font-medium"></span>
        <button onclick="showCreateModal()" class="px-6 py-3 bg-primary hover:bg-blue-600 rounded-lg font-medium transition flex items-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>New Note</span>
        </button>
    </div>
</div>

<div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

<div id="emptyState" class="hidden text-center py-16">
    <h3 class="text-xl font-semibold text-gray-400 mb-2">No notes yet</h3>
    <button onclick="showCreateModal()" class="px-6 py-3 bg-primary rounded-lg">Create Note</button>
</div>

<div id="noteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-xl max-w-2xl w-full p-6">
        <form id="noteForm" class="space-y-4">
            <input type="hidden" id="noteId" value="">
            <input type="text" id="noteTitle" placeholder="Title" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg">
            <textarea id="noteContent" placeholder="Content" required rows="5" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg"></textarea>
            <input type="text" id="noteTags" placeholder="Tags (comma-separated)" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg">
            <div class="flex gap-4">
                <label><input type="checkbox" id="notePinned"> Pin</label>
                <select id="noteColor" class="bg-gray-700 border-gray-600 rounded-lg">
                    <option value="default">Default</option>
                    <option value="red">Red</option>
                    <option value="blue">Blue</option>
                </select>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-600 rounded-lg">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-primary rounded-lg">Save Note</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let allNotes = [];

document.addEventListener('DOMContentLoaded', () => {
    loadNotes();
    setupSearch();
    setupForm();
});

async function loadNotes() {
    const response = await fetch('/api/notes');
    const data = await response.json();
    if (data.success) {
        allNotes = data.notes;
        renderNotes(allNotes);
        const el = document.getElementById('noteCount');
        if (el) el.textContent = `${allNotes.length} notes`;
    }
}

function renderNotes(notes) {
    const container = document.getElementById('notesContainer');
    if (!container) return;
    
    container.innerHTML = notes.map(note => {
        // Fix: Convert string tags to array for mapping
        const tagList = Array.isArray(note.tags) ? note.tags : (note.tags ? note.tags.split(',') : []);
        
        return `
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6">
            <h3 class="text-xl font-bold">${escapeHtml(note.title)} ${note.is_pinned ? '📌' : ''}</h3>
            <p class="text-gray-400 my-4">${escapeHtml(note.content)}</p>
            <div class="flex flex-wrap gap-2 mb-4">
                ${tagList.map(tag => `<span class="px-2 py-0.5 bg-gray-700 rounded text-xs">#${escapeHtml(tag.trim())}</span>`).join('')}
            </div>
            <div class="flex gap-2">
                <button onclick="editNote(${note.id})" class="text-blue-400">Edit</button>
                <button onclick="deleteNote(${note.id})" class="text-red-400">Delete</button>
            </div>
        </div>`;
    }).join('');
}

function setupForm() {
    const form = document.getElementById('noteForm');
    if (!form) return;
    
    form.onsubmit = async (e) => {
        e.preventDefault();
        const noteId = document.getElementById('noteId').value;
        const noteData = {
            title: document.getElementById('noteTitle').value,
            content: document.getElementById('noteContent').value,
            tags: document.getElementById('noteTags').value.split(',').map(t => t.trim()),
            is_pinned: document.getElementById('notePinned').checked,
            color: document.getElementById('noteColor').value
        };

        const url = noteId ? `/api/notes/${noteId}` : '/api/notes';
        const method = noteId ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(noteData)
        });
        
        if (response.ok) {
            closeModal();
            loadNotes();
        }
    };
}

function showCreateModal() {
    document.getElementById('noteForm').reset();
    document.getElementById('noteId').value = '';
    document.getElementById('noteModal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('noteModal').classList.add('hidden');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function setupSearch() {
    document.getElementById('searchInput').oninput = (e) => {
        const query = e.target.value.toLowerCase();
        renderNotes(allNotes.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query)));
    };
}
</script>
{% endblock %}
