{% extends "base.html" %}

{% block content %}
<div class="mb-8 flex flex-col md:flex-row gap-4">
    <div class="flex-1">
        <div class="relative">
            <input type="text" id="searchInput" placeholder="Search notes..." 
                   class="w-full px-4 py-3 pl-12 bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition">
            <svg class="w-5 h-5 text-gray-400 absolute left-4 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <span id="noteCount" class="text-sm text-gray-400 font-medium"></span>
        
        <button onclick="showCreateModal()" class="px-6 py-3 bg-primary hover:bg-blue-600 rounded-lg font-medium transition flex items-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>New Note</span>
        </button>
        <button onclick="exportNotes('json')" class="px-4 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg transition" title="Export JSON">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
        </button>
    </div>
</div>

<div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
</div>

<div id="emptyState" class="hidden text-center py-16">
    <svg class="w-24 h-24 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
    </svg>
    <h3 class="text-xl font-semibold text-gray-400 mb-2">No notes yet</h3>
    <p class="text-gray-500 mb-6">Create your first note to get started</p>
    <button onclick="showCreateModal()" class="px-6 py-3 bg-primary hover:bg-blue-600 rounded-lg font-medium transition">
        Create Note
    </button>
</div>

<div id="noteModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto fade-in">
        <div class="p-6 border-b border-gray-700 flex justify-between items-center">
            <h2 id="modalTitle" class="text-2xl font-bold">Create New Note</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-200 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <form id="noteForm" class="p-6 space-y-4">
            <input type="hidden" id="noteId" value="">
            <div>
                <label class="block text-sm font-medium mb-2">Title</label>
                <input type="text" id="noteTitle" required 
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Content</label>
                <textarea id="noteContent" required rows="10"
                          class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent resize-none"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Tags (comma-separated)</label>
                <input type="text" id="noteTags" placeholder="work, ideas, personal"
                       class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
            </div>
            <div class="flex items-center space-x-4">
                <label class="flex items-center space-x-2">
                    <input type="checkbox" id="notePinned" class="w-4 h-4 text-primary bg-gray-700 border-gray-600 rounded focus:ring-primary">
                    <span class="text-sm">Pin this note</span>
                </label>
                <select id="noteColor" class="px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary">
                    <option value="default">Default</option>
                    <option value="red">Red</option>
                    <option value="blue">Blue</option>
                    <option value="green">Green</option>
                    <option value="yellow">Yellow</option>
                    <option value="purple">Purple</option>
                </select>
            </div>
            <div class="flex justify-end space-x-3 pt-4">
                <button type="button" onclick="closeModal()" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition">
                    Cancel
                </button>
                <button type="submit" class="px-6 py-2 bg-primary hover:bg-blue-600 rounded-lg font-medium transition">
                    Save Note
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let allNotes = [];

document.addEventListener('DOMContentLoaded', () => {
    loadNotes();
    setupSearch();
    setupForm(); // Initialize form handler
});

async function loadNotes() {
    try {
        const response = await fetch('/api/notes');
        const data = await response.json();
        if (data.success) {
            allNotes = data.notes;
            renderNotes(allNotes);
            updateNoteCount(allNotes.length);
        }
    } catch (error) {
        console.error('Error loading notes:', error);
    }
}

function renderNotes(notes) {
    const container = document.getElementById('notesContainer');
    const emptyState = document.getElementById('emptyState');
    if (!container || !emptyState) return;

    if (notes.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
    }
    
    emptyState.classList.add('hidden');
    
    const colors = {
        default: 'bg-gray-800 border-gray-700',
        red: 'bg-red-900 bg-opacity-20 border-red-700',
        blue: 'bg-blue-900 bg-opacity-20 border-blue-700',
        green: 'bg-green-900 bg-opacity-20 border-green-700',
        yellow: 'bg-yellow-900 bg-opacity-20 border-yellow-700',
        purple: 'bg-purple-900 bg-opacity-20 border-purple-700'
    };
    
    container.innerHTML = notes.map(note => `
        <div class="note-card ${colors[note.color] || colors.default} border rounded-xl p-6 fade-in flex flex-col h-full">
            <div class="flex justify-between items-start mb-2">
                <h3 class="text-xl font-bold line-clamp-2">${escapeHtml(note.title)}</h3>
                ${note.is_pinned ? '📌' : ''}
            </div>
            <p class="text-gray-400 mb-4 line-clamp-3 flex-grow">${escapeHtml(note.content)}</p>
            <div class="mt-auto">
                <div class="flex flex-wrap gap-2 mb-4">
                    ${note.tags ? note.tags.map(tag => `<span class="px-2 py-0.5 bg-gray-700 rounded text-xs">#${escapeHtml(tag)}</span>`).join('') : ''}
                </div>
                <div class="flex space-x-2">
                    <button onclick="editNote(${note.id})" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-lg transition text-sm">Edit</button>
                    <button onclick="deleteNote(${note.id})" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg transition text-sm">Delete</button>
                </div>
            </div>
        </div>
    `).join('');
}

function setupForm() {
    const form = document.getElementById('noteForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault(); // CRITICAL: Prevents page refresh
        
        const noteId = document.getElementById('noteId').value;
        const noteData = {
            title: document.getElementById('noteTitle').value,
            content: document.getElementById('noteContent').value,
            tags: document.getElementById('noteTags').value.split(',').map(t => t.trim()).filter(t => t),
            is_pinned: document.getElementById('notePinned').checked,
            color: document.getElementById('noteColor').value
        };

        try {
            const url = noteId ? `/api/notes/${noteId}` : '/api/notes';
            const method = noteId ? 'PUT' : 'POST';
            
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(noteData)
            });
            
            const result = await response.json();
            if (result.success) {
                closeModal();
                loadNotes();
            } else {
                alert('Failed to save note');
            }
        } catch (error) {
            console.error('Error saving note:', error);
            alert('Error saving note');
        }
    });
}

function editNote(id) {
    const note = allNotes.find(n => n.id === id);
    if (!note) return;
    
    document.getElementById('modalTitle').textContent = 'Edit Note';
    document.getElementById('noteId').value = note.id;
    document.getElementById('noteTitle').value = note.title;
    document.getElementById('noteContent').value = note.content;
    document.getElementById('noteTags').value = note.tags.join(', ');
    document.getElementById('notePinned').checked = note.is_pinned;
    document.getElementById('noteColor').value = note.color;
    document.getElementById('noteModal').classList.remove('hidden');
}

async function deleteNote(id) {
    if (!confirm('Are you sure you want to delete this note?')) return;
    try {
        const response = await fetch(`/api/notes/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) loadNotes();
    } catch (error) {
        console.error('Error deleting note:', error);
    }
}

function exportNotes(format) {
    window.location.href = `/api/export/${format}`;
}

function updateNoteCount(count) {
    const el = document.getElementById('noteCount');
    if (el) el.textContent = `${count} note${count !== 1 ? 's' : ''}`;
}

function setupSearch() {
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allNotes.filter(n => 
                n.title.toLowerCase().includes(query) || 
                n.content.toLowerCase().includes(query)
            );
            renderNotes(filtered);
        });
    }
}

function showCreateModal() {
    document.getElementById('modalTitle').textContent = 'Create New Note';
    document.getElementById('noteForm').reset();
    document.getElementById('noteId').value = '';
    document.getElementById('noteModal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('noteModal').classList.add('hidden');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
