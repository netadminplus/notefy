apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: production
  labels:
    app: notefy
    environment: production
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notefy
      environment: production
      component: database
  template:
    metadata:
      labels:
        app: notefy
        environment: production
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: production
  labels:
    app: notefy
    component: database
spec:
  selector:
    app: notefy
    environment: production
    component: database
  ports:
  - port: 5432
    targetPort: 5432