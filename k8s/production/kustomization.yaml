apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - deployment.yaml
  - postgres.yaml
  - ingress.yaml
  - secrets.yaml
  - backup-cronjob.yaml

labels:
  - includeSelectors: true
    pairs:
      app: notefy
      environment: production

images:
  - name: ramtiin/notefy
    # The CI/CD script looks for 'newTag: ' to replace it with the latest SHA
    newTag: production-latest 

patches:
  - target:
      kind: Deployment
      name: notefy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi