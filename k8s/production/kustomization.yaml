apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - deployment.yaml
  - postgres.yaml
  - ingress.yaml
  - secrets.yaml
  - backup-cronjob.yaml

# Modern way to handle labels
labels:
  - includeSelectors: true
    pairs:
      app: notefy
      environment: production

images:
  - name: ramtiin/notefy
    newTag: production-4d55f92fc6101daf2fc4c0583b4cc88ce25985b2

# Modern way to handle patches (fixes the "unique target" error)
patches:
  - target:
      kind: Deployment
      name: notefy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi