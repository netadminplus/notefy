apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: production
spec:
  schedule: "0 2 * * *"  # Daily at 2:00 AM UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-backup
            image: postgres:15-alpine
            env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-secret
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-secret
                  key: TELEGRAM_CHAT_ID
                  optional: true
            command:
            - /bin/sh
            - -c
            - |
              #!/bin/sh
              set -e
              
              BACKUP_DIR="/backups"
              TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)
              BACKUP_FILE="notefy-backup-${TIMESTAMP}.sql.gz"
              BACKUP_PATH="${BACKUP_DIR}/${BACKUP_FILE}"
              
              echo "Starting backup at $(date)"
              
              # Create backup
              pg_dump -h postgres-service -U ${POSTGRES_USER} -d ${POSTGRES_DB} | gzip > ${BACKUP_PATH}
              
              if [ $? -eq 0 ]; then
                BACKUP_SIZE=$(du -h ${BACKUP_PATH} | cut -f1)
                echo "Backup completed successfully: ${BACKUP_FILE} (${BACKUP_SIZE})"
                
                # Send Telegram notification
                if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
                  MESSAGE="✅ Database Backup Success%0A📦 File: ${BACKUP_FILE}%0A💾 Size: ${BACKUP_SIZE}%0A⏰ Time: $(date)"
                  curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MESSAGE}" > /dev/null
                fi
                
                # Keep only last 7 backups
                ls -t ${BACKUP_DIR}/notefy-backup-*.sql.gz | tail -n +8 | xargs -r rm
                echo "Old backups cleaned up"
              else
                echo "Backup failed!"
                
                # Send failure notification
                if [ -n "${TELEGRAM_BOT_TOKEN}" ] && [ -n "${TELEGRAM_CHAT_ID}" ]; then
                  MESSAGE="❌ Database Backup Failed%0A⏰ Time: $(date)"
                  curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                    -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MESSAGE}" > /dev/null
                fi
                
                exit 1
              fi
            volumeMounts:
            - name: backup-storage
              mountPath: /backups
          restartPolicy: OnFailure
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: backup-pvc