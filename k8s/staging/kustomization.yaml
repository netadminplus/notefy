apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../base
  - ingress.yaml
  - secrets.yaml

labels:
  - includeSelectors: true
    pairs:
      app: notefy
      environment: staging

images:
  - name: ramtiin/notefy
    newTag: staging-ddd53bdc99bb206432e0fae8f2e31e918e4708ff

patches:
  - target:
      kind: Deployment
      name: notefy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1