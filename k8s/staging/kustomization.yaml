apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../base
  - ingress.yaml
  - secrets.yaml

labels:
  - includeSelectors: true
    pairs:
      app: notefy
      environment: staging

images:
  - name: ramtiin/notefy
    newTag: staging-c88bf2ea930e8fcc479330c39961a3b297c34851

patches:
  - target:
      kind: Deployment
      name: notefy
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1