apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - namespace.yaml
  - deployment.yaml
  - postgres.yaml
  - ingress.yaml

commonLabels:
  app: notefy
  environment: staging

images:
  - name: ramtiin/notefy
    newTag: staging-latest

# Staging-specific patches
patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: notefy
    spec:
      replicas: 2
  - |-
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: postgres-pvc
    spec:
      resources:
        requests:
          storage: 5Gi