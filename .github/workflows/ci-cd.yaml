name: Notefy CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOCKER_IMAGE: ramtiin/notefy
  REGISTRY: docker.io

jobs:
  lint:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint bandit -r requirements.txt
      - name: Run Quality Checks
        run: |
          black --check .
          flake8 app/
      # --- NEW: Bandit Security Scan (from Nana's video) ---
      - name: Run Bandit SAST Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
      - name: Upload Bandit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    # ... (Keep your existing Postgres service configuration here)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Tests
        env:
          DATABASE_URL: postgresql://notefy:test_password@localhost:5432/notefy_test
        run: |
          pip install -r requirements.txt pytest pytest-cov
          pytest tests/unit/ tests/integration/ -v --cov=app --cov-report=xml

  build:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
          fi
      
      # Build the image locally first for scanning
      - name: Build Docker Image locally
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:scan-tmp .

      # --- NEW: Docker Scout Scan (from Nana's video) ---
      - name: Docker Scout Scan
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: ${{ env.DOCKER_IMAGE }}:scan-tmp
          only-severities: critical,high
          # sarif-file: scout-report.sarif # Optional: for GitHub Security Tab

      - name: Push Docker Image
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:scan-tmp ${{ env.DOCKER_IMAGE }}:${{ steps.env.outputs.ENV }}-${{ github.sha }}
          docker tag ${{ env.DOCKER_IMAGE }}:scan-tmp ${{ env.DOCKER_IMAGE }}:${{ steps.env.outputs.ENV }}-latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ steps.env.outputs.ENV }}-${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:${{ steps.env.outputs.ENV }}-latest

  deploy-staging:
    # ... (Keep your existing deploy-staging logic)

  deploy-production:
    # ... (Keep your existing deploy-production logic)