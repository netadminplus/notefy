name: Notefy CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  DOCKER_IMAGE: ramtiin/notefy
  REGISTRY: docker.io

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint

      - name: Run Black
        run: |
          black .
          # We don't fail the build here, we just ensure it's formatted for the Docker build

      - name: Run Flake8
        run: flake8 app/

      - name: Run Pylint
        run: |
          pip install -r requirements.txt
          pylint app/ --fail-under=6.0

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: notefy_test
          POSTGRES_USER: notefy
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://notefy:test_password@localhost:5432/notefy_test
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://notefy:test_password@localhost:5432/notefy_test
        run: |
          pytest tests/integration/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-notefy

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine environment and tag
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_ENV
            echo "TAG_PREFIX=production" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "TAG_PREFIX=staging" >> $GITHUB_ENV
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG_PREFIX }}-${{ github.sha }}
            type=raw,value=${{ env.TAG_PREFIX }}-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:${{ env.TAG_PREFIX }}-latest
          cache-to: type=inline

      - name: Send Telegram notification - Build
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          MESSAGE="🔨 Build Complete
          ${STATUS}
          🌍 Environment: ${{ env.ENVIRONMENT }}
          📦 Image: ${{ env.TAG_PREFIX }}-${{ github.sha }}
          👤 By: ${{ github.actor }}
          🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging-notefy.ramtiin.ir
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in staging
        run: |
          cd k8s/staging
          sed -i "s|newTag:.*|newTag: staging-${{ github.sha }}|" kustomization.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add kustomization.yaml
          git commit -m "Update staging image to staging-${{ github.sha }}"
          git push

      - name: Wait for ArgoCD sync
        run: sleep 30

      - name: Run smoke tests
        run: |
          sleep 60
          curl -f https://staging-notefy.ramtiin.ir/health || exit 1
          curl -f https://staging-notefy.ramtiin.ir/metrics || exit 1

      - name: Send Telegram notification - Staging Deployment
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Success"
            EMOJI="🚀"
          else
            STATUS="❌ Failed"
            EMOJI="💥"
          fi
          MESSAGE="${EMOJI} Deployment to STAGING
          ${STATUS}
          📦 Version: staging-${{ github.sha }}
          👤 By: ${{ github.actor }}
          🔗 https://staging-notefy.ramtiin.ir
          ⏱️ Duration: ${{ job.duration }}s"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://notefy.ramtiin.ir
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in production
        run: |
          cd k8s/production
          sed -i "s|newTag:.*|newTag: production-${{ github.sha }}|" kustomization.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add kustomization.yaml
          git commit -m "Update production image to production-${{ github.sha }}"
          git push

      - name: Wait for ArgoCD sync
        run: sleep 30

      - name: Run smoke tests
        run: |
          sleep 60
          curl -f https://notefy.ramtiin.ir/health || exit 1
          curl -f https://notefy.ramtiin.ir/metrics || exit 1

      - name: Send Telegram notification - Production Deployment
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ Success"
            EMOJI="🚀"
          else
            STATUS="❌ Failed"
            EMOJI="💥"
          fi
          MESSAGE="${EMOJI} Deployment to PRODUCTION
          ${STATUS}
          📦 Version: production-${{ github.sha }}
          👤 By: ${{ github.actor }}
          🔗 https://notefy.ramtiin.ir
          ⏱️ Duration: ${{ job.duration }}s"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}"