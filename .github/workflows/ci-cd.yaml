name: Notefy CI/CD Pipeline

on:
  push:
    branches: [main, develop] # Changed 'staging' to 'develop' to match industry standards
  pull_request:
    branches: [main, develop]

env:
  DOCKER_IMAGE: ramtiin/notefy
  REGISTRY: docker.io

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pylint -r requirements.txt
      - name: Run Checks
        run: |
          black --check .
          flake8 app/
          pylint app/ --fail-under=6.0

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: notefy_test
          POSTGRES_USER: notefy
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Tests
        env:
          DATABASE_URL: postgresql://notefy:test_password@localhost:5432/notefy_test
        run: |
          pip install -r requirements.txt pytest pytest-cov
          pytest tests/unit/ tests/integration/ -v --cov=app --cov-report=xml

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
          fi
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.env.outputs.ENV }}-${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.env.outputs.ENV }}-latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update staging kustomization
        run: |
          cd k8s/staging
          sed -i "s|newTag:.*|newTag: staging-${{ github.sha }}|" kustomization.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add kustomization.yaml
          git commit -m "🚀 Deploy Staging: staging-${{ github.sha }}"
          git push

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update production kustomization
        run: |
          cd k8s/production
          sed -i "s|newTag:.*|newTag: production-${{ github.sha }}|" kustomization.yaml
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add kustomization.yaml
          git commit -m "⭐ Deploy Production: production-${{ github.sha }}"
          git push