version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: notefy_postgres
    environment:
      POSTGRES_DB: notefy_dev
      POSTGRES_USER: notefy
      POSTGRES_PASSWORD: notefy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notefy"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: notefy_app
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://notefy:notefy_dev_password@postgres:5432/notefy_dev
      - SECRET_KEY=dev-secret-key-change-in-production
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: flask run --host=0.0.0.0

  prometheus:
    image: prom/prometheus:latest
    container_name: notefy_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: notefy_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: